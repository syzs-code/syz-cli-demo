# Suite manifest — a curated playlist of scenarios to run together.
# Run it with:  syz run --suite .syz/suites/smoke.suite.yaml --env local
#
# A file passed to --suite is treated as a manifest when it has a top-level
# `scenarios:` list and no `flow:` key. Entries resolve under .syz/scenarios/
# and may be a single file (e2e/checkout.yaml) or a folder (e2e/) — a folder expands
# to every .yaml under it, recursively. Order is preserved; duplicates are dropped
# (first occurrence wins). Layer --tag / --example on top to narrow further.
name: Smoke suite
scenarios:
  - e2e/
