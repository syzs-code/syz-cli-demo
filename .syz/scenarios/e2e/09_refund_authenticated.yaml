name: "Refund — authenticated via a connection handle"
level: e2e
tags: [auth]
covers: REQ-PAYMENTS-PG-005
plugins:
  - { name: payments, version: "1.0.0" }
flow:
  - type: send
    procedure: payments.create_order
    inputs: { amount: 400, currency: USD, userId: user-6 }
    set:
      order_id: "{{ ledger.payments.create_order.http.response.fields.body.orderId }}"
  # `connection: payments_api` supplies the bearer token (masked in the report).
  - type: send
    procedure: payments.refund_order
    connection: payments_api
    inputs: { orderId: "{{ ctx.var.order_id }}", amount: 400 }
  - type: validate
    procedure: payments.validate_refunded
    inputs:
      response: "{{ ledger.payments.refund_order.http.response }}"
