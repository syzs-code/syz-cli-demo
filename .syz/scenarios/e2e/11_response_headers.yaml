name: "Headers — assert content type (Set-Cookie is auto-masked)"
level: e2e
tags: [smoke]
covers: REQ-PAYMENTS-PG-001
plugins:
  - { name: payments, version: "1.0.0" }
flow:
  - type: send
    procedure: payments.create_order
    inputs: { amount: 100, currency: USD, userId: user-8 }
  - type: validate
    procedure: payments.validate_headers
    inputs:
      response: "{{ ledger.payments.create_order.http.response }}"
