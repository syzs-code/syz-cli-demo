name: "Fixed wait — pause a known duration (contrast with poll)"
level: e2e
tags: [wait]
covers: REQ-PAYMENTS-PG-004
plugins:
  - { name: payments, version: "1.0.0" }
flow:
  - type: send
    procedure: payments.create_order
    inputs: { amount: 300, currency: USD, userId: user-5 }
    set:
      order_id: "{{ ledger.payments.create_order.http.response.fields.body.orderId }}"
  - type: send
    procedure: payments.settle_order
    inputs: {}
  # A fixed pause. This is a flakiness smell — prefer poll: (07) for real state waits.
  - type: craft
    procedure: syz.wait
    inputs: { ms: 5000 }
  - type: send
    procedure: payments.get_status
    inputs: {}
  - type: validate
    procedure: payments.validate_settled
    inputs:
      response: "{{ ledger.payments.get_status.http.response }}"
