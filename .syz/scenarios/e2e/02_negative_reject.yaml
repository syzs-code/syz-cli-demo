name: "Negative — reject a zero amount"
level: e2e
tags: [smoke, negative]
covers: REQ-PAYMENTS-PG-002
plugins:
  - { name: payments, version: "1.0.0" }
flow:
  - type: send
    procedure: payments.create_order
    inputs: { amount: 0, currency: USD, userId: user-1 }
  - type: validate
    procedure: payments.validate_rejected
    inputs:
      response: "{{ ledger.payments.create_order.http.response }}"
