name: payments.list_orders
type: send
execution_library: http
description: "List orders, filtered by status via a query parameter"
connection:
  execution_library: http
  lifecycle: ephemeral
  http:
    request:
      fields:
        base_url: "{{ env.payments.base_url }}"
http:
  request:
    fields:
      method: GET
      path: /orders
      query:
        status: "{{ inputs.status }}"
