name: payments.get_status
type: send
execution_library: http
description: "Read an order's settlement status (the poll target)"
connection:
  execution_library: http
  lifecycle: ephemeral
  http:
    request:
      fields:
        base_url: "{{ env.payments.base_url }}"
http:
  request:
    fields:
      method: GET
      path: /orders/{{ ctx.var.order_id }}/status
